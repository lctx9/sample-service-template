# Start everything:   docker compose up -d --build
# Stop:               docker compose down
# Reset all data:     docker compose down -v
# Values come from .env (copy .env.example to .env first).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sample_db}
      POSTGRES_USER: ${DB_USER:-sample}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sample}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sample} -d ${DB_NAME:-sample_db}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 10

  sample-service:
    build:
      context: .
      args:
        MODULE: sample-service
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-sample_db}
      DB_USER: ${DB_USER:-sample}
      DB_PASSWORD: ${DB_PASSWORD:-sample}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      SAMPLE_SERVICE_URL: http://sample-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - sample-service

volumes:
  postgres-data:
