server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: sample-service

  # All connection info comes from environment variables. Defaults are for local only.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sample_db}
    username: ${DB_USER:sample}
    password: ${DB_PASSWORD:sample}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # tables are created by Flyway, never by Hibernate

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always   # shows db and rabbit status

springdoc:
  swagger-ui:
    path: /swagger-ui.html
